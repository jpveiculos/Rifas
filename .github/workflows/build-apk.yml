name: Build Rifas.TOP APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build APK
        run: gradle -p android :app:assembleDebug --stacktrace
      - name: Publish APK
        run: |
          mkdir -p public/app
          cp android/app/build/outputs/apk/debug/app-debug.apk public/app/RifasTOP.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/app/RifasTOP.apk
          if git diff --cached --quiet; then
            echo "APK sem alterações para publicar."
          else
            git commit -m "Publicar APK do Rifas.TOP"
            git push
          fi
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RifasTOP-APK
          path: public/app/RifasTOP.apk
          retention-days: 30
